name: Build ChessNova APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to compile'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment and signing credentials
        run: |
          echo "Configuring build environment..."
          
          # Ensure .env exists for the Secrets Gradle plugin
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          elif [ ! -f .env ]; then
            touch .env
            echo "Created blank .env"
          fi

          # Restore debug.keystore from base64 if not already present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x gradlew

      - name: Build Debug APK
        run: |
          echo "Running Gradle assembleDebug..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and Stage APK
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Build completed but no APK was found at $APK_SOURCE!"
            exit 1
          fi

          mkdir -p dist
          cp "$APK_SOURCE" dist/Chess-Nova.apk
          echo "APK successfully verified and staged:"
          ls -lh dist/Chess-Nova.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Nova-APK
          path: dist/Chess-Nova.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Chess-Nova.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
